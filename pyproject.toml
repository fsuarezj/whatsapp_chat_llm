[project]
name = "whatsapp-chat-llm"
version = "0.1.0"
description = "Whatsapp app for chat with an llm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.0",
    "flask-jwt-extended>=4.7.1",
    "flask-limiter>=3.12",
    "flask-sqlalchemy>=3.1.1",
    "langchain-community>=0.3.20",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "loguru-config>=0.1.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.4",
    "pytest>=8.3.5",
]
